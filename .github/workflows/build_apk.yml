name: Build KuroYomi APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # May pindutan ka para makapag-build kahit kailan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KuroYomi Debug App
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # assembleDebug ang tamang command para sa TachiyomiSY codebase
      - name: Build app
        run: ./gradlew assembleDebug

      # I-upload ang lahat ng generated APKs (universal at per-architecture)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KuroYomi-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
