name: Build KuroYomi APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch: # Binibigyan ka ng "Run workflow" button para makapag-build kahit kailan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Kailangan ng TachiyomiSY para sa commit count / versioning

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Nag-bu-build ng Standard Debug APK (Ready to install sa Android)
      - name: Build Standard APK
        run: ./gradlew assembleStandardDebug --stacktrace

      - name: Prepare APK for Artifact
        id: prepare-apk
        run: |
          mkdir -p build-output
          # Hanapin ang na-generate na APK at i-rename para malinis
          APK_PATH=$(find app/build/outputs/apk/standard/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/KuroYomi-standard-debug.apk
            echo "apk_exists=true" >> $GITHUB_OUTPUT
            echo "APK ready: build-output/KuroYomi-standard-debug.apk"
          else
            echo "apk_exists=false" >> $GITHUB_OUTPUT
            echo "Error: APK not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroYomi-Debug-APK
          path: build-output/KuroYomi-standard-debug.apk
          retention-days: 14
